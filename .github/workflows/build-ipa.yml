name: Build unsigned IPA

# 在 GitHub 的 macOS 云端机器上编译出未签名 IPA，
# 下载后可直接用 TrollStore 安装（无需越狱、无需证书）。
#
# ⚠️ runner 镜像会退役：GitHub 已于 2026-11-02 下线 macOS 14 镜像，
#    写死 macos-14 会直接报 “The configuration 'macos-14-arm64-us-default' is not supported”，
#    任务在 0s 被取消。这里用 macos-15，并允许手动选择镜像，镜像退役时不用改文件。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS 运行器镜像'
        required: false
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-26
          - macos-latest
          - macos-15-intel

jobs:
  build:
    # 未手动指定时默认 macos-15（Apple Silicon，自带 Xcode 16+）
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30

    steps:
      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen / ldid
        run: |
          brew install xcodegen
          brew install ldid || true

      - name: 准备网页资源
        run: |
          rm -rf ios/GoldMiner/www
          mkdir -p ios/GoldMiner/www
          cp -R www/. ios/GoldMiner/www/
          ls -la ios/GoldMiner/www

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（关闭签名）
        working-directory: ios
        run: |
          xcodebuild \
            -project GoldMiner.xcodeproj \
            -scheme GoldMiner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 打包 IPA
        working-directory: ios
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/GoldMiner.app"
          ls -la "$APP"
          rm -rf Payload GoldMiner.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          if command -v ldid >/dev/null 2>&1; then
            ldid -S Payload/GoldMiner.app/GoldMiner || true
          fi
          zip -qry GoldMiner.ipa Payload
          ls -lh GoldMiner.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: GoldMiner-ipa
          path: ios/GoldMiner.ipa
          if-no-files-found: error
