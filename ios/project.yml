name: GoldMiner

options:
  bundleIdPrefix: com.goldminer
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "14.0"
  minimumXcodeGenVersion: "2.20.0"

targets:
  GoldMiner:
    type: application
    platform: iOS
    sources:
      - path: GoldMiner
        excludes:
          - "www"
          - "Info.plist"
      - path: GoldMiner/www
        type: folder
        buildPhase: resources
    info:
      path: GoldMiner/Info.plist
      properties:
        CFBundleDisplayName: 黄金矿工
        CFBundleName: GoldMiner
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationExitsOnSuspend: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldminer.game
        PRODUCT_NAME: GoldMiner
        INFOPLIST_FILE: GoldMiner/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
