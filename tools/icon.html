<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="icon" width="1024" height="1024"></canvas>
<script>
(function () {
  var S = 1024;
  var c = document.getElementById('icon');
  var g = c.getContext('2d');

  function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
  function blobPath(g, pts){
    var n=pts.length;
    var mx=(pts[n-1].x+pts[0].x)/2, my=(pts[n-1].y+pts[0].y)/2;
    g.beginPath(); g.moveTo(mx,my);
    for(var i=0;i<n;i++){var p0=pts[i],p1=pts[(i+1)%n];g.quadraticCurveTo(p0.x,p0.y,(p0.x+p1.x)/2,(p0.y+p1.y)/2);}
    g.closePath();
  }

  // 背景
  var bg = g.createRadialGradient(S*0.5, S*0.44, S*0.05, S*0.5, S*0.55, S*0.78);
  bg.addColorStop(0, '#5b3a1a');
  bg.addColorStop(0.45, '#3a2410');
  bg.addColorStop(0.8, '#1a1008');
  bg.addColorStop(1, '#0a0603');
  g.fillStyle = bg;
  g.fillRect(0, 0, S, S);

  // 背景微粒
  var rng = mulberry32(2026);
  for (var i = 0; i < 160; i++) {
    var x = rng()*S, y = rng()*S;
    g.fillStyle = 'rgba(255,210,120,' + (0.02 + rng()*0.07).toFixed(3) + ')';
    g.beginPath(); g.arc(x, y, 1 + rng()*4, 0, Math.PI*2); g.fill();
  }

  // 金色光晕
  var glow = g.createRadialGradient(S*0.5, S*0.54, S*0.08, S*0.5, S*0.54, S*0.5);
  glow.addColorStop(0, 'rgba(255,196,60,0.42)');
  glow.addColorStop(0.55, 'rgba(255,160,20,0.12)');
  glow.addColorStop(1, 'rgba(255,160,20,0)');
  g.fillStyle = glow;
  g.fillRect(0,0,S,S);

  // 金块
  var R = S*0.30;
  var cx = S*0.5, cy = S*0.575;
  var pts = [];
  var n = 12;
  var r2 = mulberry32(77);
  for (var k = 0; k < n; k++) {
    var a = (k/n)*Math.PI*2;
    var rad = R*(0.80 + r2()*0.28);
    pts.push({x: cx + Math.cos(a)*rad, y: cy + Math.sin(a)*rad*0.95});
  }
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.55)';
  g.shadowBlur = 60;
  g.shadowOffsetY = 26;
  var grad = g.createRadialGradient(cx-R*0.34, cy-R*0.42, R*0.06, cx, cy, R*1.2);
  grad.addColorStop(0, '#fffce8');
  grad.addColorStop(0.26, '#ffdd63');
  grad.addColorStop(0.6, '#efa81b');
  grad.addColorStop(1, '#7d4c04');
  blobPath(g, pts);
  g.fillStyle = grad;
  g.fill();
  g.restore();

  g.save();
  blobPath(g, pts);
  g.clip();
  // 暗部（不规则切面，避免"奶酪"感）
  g.fillStyle = 'rgba(126,72,4,0.16)';
  for (var m = 0; m < 3; m++) {
    var bx = cx + (r2()-0.5)*R*1.4, by = cy + (r2()-0.35)*R*1.0;
    var fr = R*(0.18+r2()*0.16);
    g.beginPath();
    for (var q = 0; q < 6; q++) {
      var qa = (q/6)*Math.PI*2 + r2()*0.4;
      var qr = fr*(0.6+r2()*0.8);
      if (q === 0) g.moveTo(bx+Math.cos(qa)*qr, by+Math.sin(qa)*qr*0.8);
      else g.lineTo(bx+Math.cos(qa)*qr, by+Math.sin(qa)*qr*0.8);
    }
    g.closePath(); g.fill();
  }
  // 切面棱线
  g.strokeStyle = 'rgba(150,92,8,0.28)';
  g.lineWidth = R*0.035;
  g.beginPath(); g.moveTo(cx-R*0.15, cy-R*0.55); g.lineTo(cx+R*0.32, cy-R*0.1); g.lineTo(cx+R*0.12, cy+R*0.42); g.stroke();
  g.beginPath(); g.moveTo(cx-R*0.62, cy+R*0.1); g.lineTo(cx-R*0.2, cy+R*0.36); g.stroke();
  // 高光
  g.fillStyle = 'rgba(255,255,246,0.9)';
  g.beginPath(); g.ellipse(cx-R*0.33, cy-R*0.4, R*0.24, R*0.13, -0.55, 0, Math.PI*2); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.55)';
  g.beginPath(); g.ellipse(cx-R*0.02, cy-R*0.56, R*0.1, R*0.06, -0.3, 0, Math.PI*2); g.fill();
  g.restore();

  g.strokeStyle = 'rgba(88,54,4,0.9)';
  g.lineWidth = R*0.055;
  blobPath(g, pts);
  g.stroke();

  // 吊绳 + 铁钩（从上方垂下，钩住金块上沿）
  var hx = S*0.5, hy = S*0.215;
  g.strokeStyle = 'rgba(247,231,189,0.95)';
  g.lineWidth = 14;
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(hx, 0); g.lineTo(hx, hy+60); g.stroke();
  g.strokeStyle = 'rgba(120,95,55,0.4)';
  g.lineWidth = 14;
  for (var t = 20; t < hy+50; t += 26) {
    g.beginPath(); g.moveTo(hx-5, t); g.lineTo(hx+5, t+10); g.stroke();
  }
  // 钩身
  g.save();
  g.translate(hx, hy+58);
  var mg = g.createLinearGradient(-26, 0, 26, 0);
  mg.addColorStop(0, '#8e99a5');
  mg.addColorStop(0.4, '#eef4fb');
  mg.addColorStop(0.75, '#9aa6b3');
  mg.addColorStop(1, '#5d6670');
  g.strokeStyle = mg;
  g.lineWidth = 22;
  g.beginPath(); g.moveTo(0, -18); g.lineTo(0, 40); g.stroke();
  g.lineWidth = 20;
  g.beginPath(); g.moveTo(0, 30); g.quadraticCurveTo(-52, 60, -44, 104); g.stroke();
  g.beginPath(); g.moveTo(0, 30); g.quadraticCurveTo(52, 60, 44, 104); g.stroke();
  g.fillStyle = '#dbe4ee';
  g.beginPath(); g.arc(0, 20, 15, 0, Math.PI*2); g.fill();
  g.restore();

  // 闪光十字
  function spark(x, y, s, a) {
    g.save();
    g.globalAlpha = a;
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.moveTo(x, y-s); g.lineTo(x+s*0.22, y-s*0.22); g.lineTo(x+s, y);
    g.lineTo(x+s*0.22, y+s*0.22); g.lineTo(x, y+s); g.lineTo(x-s*0.22, y+s*0.22);
    g.lineTo(x-s, y); g.lineTo(x-s*0.22, y-s*0.22);
    g.closePath(); g.fill();
    g.restore();
  }
  spark(S*0.30, S*0.36, 44, 0.95);
  spark(S*0.74, S*0.72, 30, 0.8);
  spark(S*0.66, S*0.30, 20, 0.6);
})();
</script>
</body>
</html>
